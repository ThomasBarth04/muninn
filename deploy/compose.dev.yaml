# Local development: just Postgres, same roles as production.
#   docker compose -f deploy/compose.dev.yaml up -d
name: muninn-dev

services:
  db:
    build: postgres
    image: muninn-postgres
    environment:
      POSTGRES_PASSWORD: postgres
      MUNINN_OWNER_PASSWORD: muninn
      MUNINN_APP_PASSWORD: muninn
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
