# Production: one Hetzner Cloud server in the EU (ADR 0008).
#   docker compose -f deploy/compose.yaml pull app     # the image CI built from main
#   docker compose -f deploy/compose.yaml up -d
# Roll back with MUNINN_TAG=<git sha> in deploy/.env; `up -d --build` builds on the box instead.
name: muninn

# Docker keeps container logs forever by default, until the disk is full.
x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: "5" }

x-walg-env: &walg-env
  WALG_S3_PREFIX: ${WALG_S3_PREFIX}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_ENDPOINT: ${AWS_ENDPOINT}
  AWS_REGION: ${AWS_REGION}
  AWS_S3_FORCE_PATH_STYLE: ${AWS_S3_FORCE_PATH_STYLE:-true}
  WALG_COMPRESSION_METHOD: brotli

services:
  app:
    image: ghcr.io/thomasbarth04/muninn:${MUNINN_TAG:-latest}
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    logging: *logging
    # SIGTERM stops new work; running jobs finish (each external call times
    # out at 30 s, the seats job makes two).
    stop_grace_period: 1m
    # Listed, not env_file: the internet-facing process never sees the
    # superuser password or the backup bucket's keys.
    environment:
      RUST_LOG: ${RUST_LOG}
      APP_URL: ${APP_URL}
      INBOUND_DOMAIN: ${INBOUND_DOMAIN}
      MAIL_FROM: ${MAIL_FROM}
      POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN}
      POSTMARK_ACCOUNT_TOKEN: ${POSTMARK_ACCOUNT_TOKEN}
      POSTMARK_SYSTEM_STREAM: ${POSTMARK_SYSTEM_STREAM}
      POSTMARK_CUSTOMER_STREAM: ${POSTMARK_CUSTOMER_STREAM}
      POSTMARK_TRIAL_STREAM: ${POSTMARK_TRIAL_STREAM}
      POSTMARK_INBOUND_USER: ${POSTMARK_INBOUND_USER}
      POSTMARK_INBOUND_PASSWORD: ${POSTMARK_INBOUND_PASSWORD}
      JEV_API_URL: ${JEV_API_URL:-https://api.typesafe.ai}
      JEV_API_KEY: ${JEV_API_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID}
      DATABASE_URL: postgres://muninn_app:${MUNINN_APP_PASSWORD}@db:5432/muninn
      MIGRATE_DATABASE_URL: postgres://muninn_owner:${MUNINN_OWNER_PASSWORD}@db:5432/muninn
    depends_on:
      db: { condition: service_healthy }

  db:
    build: postgres
    image: muninn-postgres
    restart: unless-stopped
    logging: *logging
    shm_size: 256mb
    environment:
      <<: *walg-env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MUNINN_OWNER_PASSWORD: ${MUNINN_OWNER_PASSWORD}
      MUNINN_APP_PASSWORD: ${MUNINN_APP_PASSWORD}
    # Every WAL segment goes to object storage; archive_timeout forces a switch
    # at least once a minute, so a lost disk loses at most about a minute.
    command: >
      postgres
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='wal-g wal-push %p'
      -c archive_timeout=60
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "muninn"]
      interval: 5s
      retries: 20

  # Daily base backup plus retention. WAL is pushed continuously by db itself.
  walg:
    image: muninn-postgres
    restart: unless-stopped
    logging: *logging
    user: postgres
    environment:
      <<: *walg-env
      PGDATA: /var/lib/postgresql/data
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          if wal-g backup-push "$$PGDATA" && wal-g delete retain FULL 14 --confirm; then
            # /healthz reads this. The table exists once the app has migrated.
            until psql -d muninn -qc 'INSERT INTO base_backups DEFAULT VALUES'; do sleep 60; done
            sleep 86400
          else
            echo "base backup failed, retrying in 10 minutes" >&2
            sleep 600
          fi
        done
    volumes:
      - pgdata:/var/lib/postgresql/data
    depends_on:
      db: { condition: service_healthy }

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    environment:
      DOMAIN: ${DOMAIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
